<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1280" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#171816"/>
      <stop offset="55%" stop-color="#1F201D"/>
      <stop offset="100%" stop-color="#141513"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="120" y1="0" x2="1160" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B69A69" stop-opacity="0"/>
      <stop offset="50%" stop-color="#B69A69" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#B69A69" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect width="1280" height="380" fill="url(#bgGrad)"/>

  <!-- Subtle Architectural Grid Lines -->
  <line x1="96" y1="0" x2="96" y2="380" stroke="#F7F5F0" stroke-opacity="0.04"/>
  <line x1="1184" y1="0" x2="1184" y2="380" stroke="#F7F5F0" stroke-opacity="0.04"/>
  <rect x="28" y="28" width="1224" height="324" stroke="#B69A69" stroke-opacity="0.32" stroke-width="1"/>
  <rect x="36" y="36" width="1208" height="308" stroke="#F7F5F0" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Monogram Crest -->
  <g transform="translate(612, 58)">
    <rect width="56" height="56" fill="#171816" stroke="#B69A69" stroke-width="1.2" stroke-opacity="0.75"/>
    <path d="M15 16L28 41L41 16" stroke="#F7F5F0" stroke-width="2.2" stroke-linecap="square"/>
    <path d="M21.5 16L28 29L34.5 16" stroke="#B69A69" stroke-width="1.4" stroke-linecap="square"/>
  </g>

  <!-- Eyebrow -->
  <text x="640" y="148" text-anchor="middle" fill="#B69A69" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" letter-spacing="5.5">
    LUXURY REAL ESTATE DISCOVERY &amp; PROPERTY MARKETPLACE
  </text>

  <!-- Wordmark -->
  <text x="640" y="218" text-anchor="middle" fill="#F7F5F0" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="400" letter-spacing="14">
    VIMROLL ESTATE
  </text>

  <!-- Hairline Divider -->
  <line x1="340" y1="246" x2="940" y2="246" stroke="url(#goldLine)" stroke-width="1"/>

  <!-- Tagline -->
  <text x="640" y="280" text-anchor="middle" fill="#E8E1D5" fill-opacity="0.88" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="21" letter-spacing="0.8">
    Where Exceptional Living Begins.
  </text>

  <!-- Global Capitals Footer -->
  <text x="640" y="322" text-anchor="middle" fill="#B69A69" fill-opacity="0.85" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="600" letter-spacing="4.2">
    DUBAI   ·   LONDON   ·   NEW YORK   ·   PARIS   ·   MARBELLA   ·   LAGOS
  </text>
